<!DOCTYPE html>
<html>
<head>
<style>
  body { background: repeating-linear-gradient(45deg, #f00, #f00 20px, #00f 20px, #00f 40px); height: 100vh; }
  .box1 { width: 200px; height: 100px; backdrop-filter: url(#f1); background: rgba(255,255,255,0.1); }
  .box2 { width: 200px; height: 100px; backdrop-filter: url(#f2); background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
  <!-- Test 1: feTurbulence directly -->
  <div class="box1"></div>
  <svg width="0" height="0">
    <filter id="f1">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" />
    </filter>
  </svg>

  <!-- Test 2: feImage data URI -->
  <div class="box2"></div>
  <svg width="0" height="0">
    <filter id="f2">
      <feImage href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.05'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)'/%3E%3C/svg%3E" result="map" preserveAspectRatio="none" />
      <feDisplacementMap in="SourceGraphic" in2="map" scale="20" />
    </filter>
  </svg>
</body>
</html>
